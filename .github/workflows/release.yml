name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS app
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_CERTIFICATE_BASE64:-}" ]]; then
            echo "Apple Developer certificate is not configured; using ad hoc signing."
            exit 0
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"

      - name: Run tests
        run: swift test

      - name: Build application bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: ./scripts/build-app.sh

      - name: Package release assets
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          architecture="$(uname -m)"
          archive_path="dist/Bye.DS_Store-${RELEASE_TAG}-macOS-${architecture}.zip"
          dmg_path="dist/Bye.DS_Store-${RELEASE_TAG}-macOS-${architecture}.dmg"
          checksum_path="${archive_path}.sha256"
          dmg_checksum_path="${dmg_path}.sha256"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "dist/Bye.DS_Store.app" \
            "$archive_path"

          hdiutil create \
            -volname "Bye.DS_Store ${RELEASE_TAG}" \
            -srcfolder "dist/Bye.DS_Store.app" \
            -ov \
            -format UDZO \
            "$dmg_path"

          shasum -a 256 "$archive_path" > "$checksum_path"
          shasum -a 256 "$dmg_path" > "$dmg_checksum_path"

          echo "archive=$archive_path" >> "$GITHUB_OUTPUT"
          echo "archive_checksum=$checksum_path" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "dmg_checksum=$dmg_checksum_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_DEVELOPER_IDENTITY:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo "Apple notarization secrets are not fully configured; publishing an ad hoc signed DMG."
            exit 0
          fi

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
          ARCHIVE_CHECKSUM_PATH: ${{ steps.package.outputs.archive_checksum }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
          DMG_CHECKSUM_PATH: ${{ steps.package.outputs.dmg_checksum }}
        run: |
          set -euo pipefail

          notes_file=".github/release-notes/${RELEASE_TAG}.md"

          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ -f "$notes_file" ]]; then
              gh release edit \
                "$RELEASE_TAG" \
                --title "Bye.DS_Store $RELEASE_TAG" \
                --notes-file "$notes_file"
            fi

            gh release upload \
              "$RELEASE_TAG" \
              "$ARCHIVE_PATH" \
              "$ARCHIVE_CHECKSUM_PATH" \
              "$DMG_PATH" \
              "$DMG_CHECKSUM_PATH" \
              --clobber
          else
            gh release create \
              "$RELEASE_TAG" \
              "$ARCHIVE_PATH" \
              "$ARCHIVE_CHECKSUM_PATH" \
              "$DMG_PATH" \
              "$DMG_CHECKSUM_PATH" \
              --verify-tag \
              "${notes_args[@]}" \
              --title "Bye.DS_Store $RELEASE_TAG"
          fi

      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
