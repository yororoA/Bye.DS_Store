name: Bug 报告
description: 报告启动、监控、扫描、更新或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量完整填写以下信息，尤其是 Mac 芯片、macOS 版本和故障表现。

        当前 Release 仅提供 Apple Silicon (`arm64`) 版本，并要求 macOS 14 或更高版本。

  - type: dropdown
    id: symptom
    attributes:
      label: 问题表现
      description: 请选择最接近实际情况的一项。
      options:
        - 应用无法打开或没有任何界面
        - 应用出现彩球或无响应
        - 应用崩溃或自动退出
        - Finder 出现彩球或无响应
        - 整个 macOS 无响应
        - 菜单栏图标或控制面板异常
        - 后台监控或清理异常
        - 全盘扫描异常
        - 自动更新或安装异常
        - 其他
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Bye.DS_Store 版本
      description: 可填写 Release 标签、设置页中的版本号或本地构建的 commit。
      placeholder: 例如 1.4.0 或 b7f772c
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: 芯片架构
      description: 可在“关于本机”中查看，也可以在终端运行 `uname -m`。
      options:
        - Apple Silicon（M1 / M2 / M3 / M4）
        - Intel
        - 不确定
    validations:
      required: true

  - type: input
    id: mac_model
    attributes:
      label: Mac 型号
      placeholder: 例如 MacBook Pro 14 英寸（2023）
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS 版本
      description: 可在终端运行 `sw_vers -productVersion`。
      placeholder: 例如 15.7.1
    validations:
      required: true

  - type: dropdown
    id: installation_source
    attributes:
      label: 安装来源
      options:
        - GitHub Release DMG
        - 应用内自动更新
        - 本地运行 scripts/build-app.sh
        - 直接运行 Swift Package
        - 其他
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 实际表现
      description: 请说明卡住的是应用、Finder 还是整个系统，以及是否出现彩球、弹窗、闪退或菜单栏图标。
      placeholder: |
        例如：双击应用后 Finder 出现彩球约 30 秒，但鼠标仍可移动，其他应用可正常使用。
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 复现步骤
      description: 请从应用尚未运行的状态开始描述。
      placeholder: |
        1. 挂载 DMG
        2. 双击 Bye.DS_Store
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期表现
      placeholder: 描述你认为应用应该如何运行。
    validations:
      required: true

  - type: textarea
    id: finder_environment
    attributes:
      label: Finder 与磁盘环境
      description: 问题发生时是否连接网络盘、NAS、外接硬盘或打开大量 Finder 窗口？
      placeholder: |
        - Finder 窗口数量：
        - 网络盘 / NAS：
        - 外接硬盘：
        - 其他特殊目录：

  - type: textarea
    id: diagnostics
    attributes:
      label: 日志、崩溃报告或进程取样
      description: |
        可以粘贴“活动监视器”中的进程取样、控制台崩溃报告或相关日志。请先删除用户名、路径等敏感信息。
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可拖入截图或屏幕录像，并补充其他可能相关的信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题。
          required: true
        - label: 我已删除日志和截图中的个人信息、私密路径及其他敏感数据。
          required: true
