name: 功能建议
description: 提议新功能、交互改进或兼容性增强
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述你遇到的实际场景和期望结果。相比只描述按钮或界面，具体使用场景更有助于评估方案。

  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 后台监控与清理
        - 全盘扫描与排除规则
        - 菜单栏与设置界面
        - 自动更新与安装
        - 芯片或 macOS 兼容性
        - 多语言
        - 官网、文档或发布流程
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
      description: 请说明你在什么情况下遇到了什么限制。
      placeholder: 当我……时，目前只能……，因此……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述期望的行为或交互，不要求提供具体技术实现。
      placeholder: 我希望应用能够……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 如果你已经使用其他方式解决，请简要说明。

  - type: dropdown
    id: priority
    attributes:
      label: 对你的影响
      options:
        - 阻碍正常使用
        - 明显影响使用效率
        - 一般体验改进
        - 锦上添花
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可拖入截图、示意图或相关链接。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
