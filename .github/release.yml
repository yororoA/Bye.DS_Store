changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: "新功能 / Features"
      labels:
        - enhancement
        - feature
    - title: "问题修复 / Bug Fixes"
      labels:
        - bug
        - fix
    - title: "文档 / Documentation"
      labels:
        - documentation
    - title: "其他变更 / Other Changes"
      labels:
        - "*"
